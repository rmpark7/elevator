<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공간 프로토콜 프로젝트</title>
    <style>
        /* 기본 스타일 리셋 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f5f6fa;
            font-family: 'Pretendard', -apple-system, sans-serif;
            overflow-x: hidden;
            color: #333;
        }

        /* 인트로 컨테이너: 투명 블러 배경 */
        #intro-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, rgba(230, 240, 245, 0.6), rgba(200, 220, 230, 0.4));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 120px;
            transition: opacity 1s ease-out;
        }

        /* 실제 설치 형태를 반영한 빨간 돼지 저금통 */
        .piggy-bank {
            width: 220px;
            height: 170px;
            background-color: #e73c30; /* 강렬한 레드 */
            border-radius: 90px 100px 90px 90px;
            position: relative;
            z-index: 10;
            box-shadow: 0 10px 25px rgba(231, 60, 48, 0.3);
            transition: transform 0.1s ease;
        }
        /* 돼지 코 부분 */
        .piggy-bank::before {
            content: '';
            position: absolute;
            left: -15px;
            top: 65px;
            width: 20px;
            height: 45px;
            background-color: #e73c30;
            border-radius: 8px 0 0 8px;
        }
        /* 돼지 귀 부분 */
        .piggy-bank::after {
            content: '';
            position: absolute;
            left: 40px;
            top: -15px;
            width: 30px;
            height: 35px;
            background-color: #e73c30;
            border-radius: 50% 50% 0 0;
            transform: rotate(-10deg);
        }
        /* 돼지 눈 */
        .pig-eye {
            position: absolute;
            left: 25px;
            top: 50px;
            width: 12px;
            height: 12px;
            background-color: #fff;
            border-radius: 50%;
        }
        /* 저금통 투입구 슬롯 */
        .pig-slot {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 8px;
            background-color: #b71c1c;
            border-radius: 4px;
        }

        /* A+ 노란색 코인 구현 */
        .coin-aplus {
            width: 75px;
            height: 75px;
            background-color: #f7ca18;
            border: 4px solid #d4a307;
            border-radius: 50%;
            position: absolute;
            top: -100px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #d4a307;
            font-size: 30px;
            font-weight: 900;
            font-family: 'Helvetica', sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            opacity: 0;
            z-index: 5;
            animation: dropCoin 1.4s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
        }

        /* 코인 추락 애니메이션 */
        @keyframes dropCoin {
            0% {
                top: -100px;
                opacity: 1;
                transform: rotate(0deg);
            }
            85% {
                top: calc(100vh - 315px); /* 돼지 저금통 투입구 바로 위 */
                opacity: 1;
                transform: rotate(360deg);
            }
            100% {
                top: calc(100vh - 240px); /* 돼지 안으로 완전히 빨려 들어감 */
                opacity: 0;
                transform: rotate(400deg) scale(0.6);
            }
        }

        /* 코인이 부딪혔을 때 돼지가 반응하는 팅김 효과 */
        @keyframes bouncePig {
            0% { transform: scale(1); }
            40% { transform: scale(1.1, 0.9) translateY(5px); }
            70% { transform: scale(0.95, 1.05) translateY(-10px); }
            100% { transform: scale(1) translateY(0); }
        }

        /* 메인 콘텐츠 스타일 (인트로 완료 후 서서히 등장) */
        #main-content {
            opacity: 0;
            padding: 60px 20px;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            transition: opacity 1.5s ease-in-out;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .project-desc {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div id="intro-container">
        <div class="coin-aplus" id="coin">A+</div>
        
        <div class="piggy-bank" id="piggy">
            <div class="pig-slot"></div>
            <div class="pig-eye"></div>
        </div>
    </div>

    <div id="main-content">
        <h1>투명 엘리베이터 시선 유도 프로토콜</h1>
        <p class="project-desc">
            일상 공간의 가설을 비틀고 낯선 제스처를 삽입하여<br>
            사람들의 시선을 인터랙트하는 공간 디자인 실험 프로젝트입니다.
        </p>
    </div>

    <script>
        const coin = document.getElementById('coin');
        const piggy = document.getElementById('piggy');
        const introContainer = document.getElementById('intro-container');
        const mainContent = document.getElementById('main-content');

        // 코인의 가로 위치를 화면 중앙으로 세팅
        coin.style.left = 'calc(50% - 37.5px)'; 

        // 코인이 돼지 저금통에 도달하는 타이밍에 맞춰 팅김 애니메이션 실행
        setTimeout(() => {
            piggy.style.animation = "bouncePig 0.4s ease-in-out forwards";
        }, 1200);

        // 인트로가 끝나고 메인 페이지로 부드럽게 전환
        setTimeout(() => {
            introContainer.style.opacity = '0';
            mainContent.style.opacity = '1';

            setTimeout(() => {
                introContainer.style.display = 'none';
            }, 1000);
        }, 3200);
    </script>
</body>
</html>
