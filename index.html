<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공간 프로토콜 프로젝트</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #f8f9fa; font-family: 'Pretendard', -apple-system, sans-serif; overflow-x: hidden; color: #333; }

        /* --- 인트로 애니메이션 스타일 --- */
        #intro-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, rgba(230, 240, 245, 0.6), rgba(200, 220, 230, 0.4));
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 1000; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 120px;
            transition: opacity 1s ease-out;
        }
        .piggy-bank { width: 200px; height: 150px; background-color: #e73c30; border-radius: 80px 90px 80px 80px; position: relative; z-index: 10; box-shadow: 0 10px 25px rgba(231, 60, 48, 0.3); transition: transform 0.1s ease; }
        .piggy-bank::before { content: ''; position: absolute; left: -15px; top: 60px; width: 20px; height: 40px; background-color: #e73c30; border-radius: 8px 0 0 8px; }
        .piggy-bank::after { content: ''; position: absolute; left: 35px; top: -12px; width: 25px; height: 30px; background-color: #e73c30; border-radius: 50% 50% 0 0; transform: rotate(-10deg); }
        .pig-eye { position: absolute; left: 25px; top: 45px; width: 10px; height: 10px; background-color: #fff; border-radius: 50%; }
        .pig-slot { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 80px; height: 8px; background-color: #b71c1c; border-radius: 4px; }
        .coin-aplus { width: 70px; height: 70px; background-color: #f7ca18; border: 4px solid #d4a307; border-radius: 50%; position: absolute; top: -100px; display: flex; justify-content: center; align-items: center; color: #d4a307; font-size: 28px; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.15); opacity: 0; z-index: 5; animation: dropCoin 1.4s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards; }

        @keyframes dropCoin {
            0% { top: -100px; opacity: 1; transform: rotate(0deg); }
            85% { top: calc(100vh - 295px); opacity: 1; transform: rotate(360deg); }
            100% { top: calc(100vh - 230px); opacity: 0; transform: rotate(400deg) scale(0.6); }
        }
        @keyframes bouncePig {
            0% { transform: scale(1); }
            40% { transform: scale(1.1, 0.9) translateY(5px); }
            70% { transform: scale(0.95, 1.05) translateY(-10px); }
            100% { transform: scale(1) translateY(0); }
        }

        /* --- 메인 콘텐츠 웹페이지 스타일 --- */
        #main-content {
            opacity: 0; max-width: 900px; margin: 0 auto; padding: 80px 20px; text-align: center; transition: opacity 1.5s ease-in-out;
        }

        h1 { font-size: 2.3rem; color: #2c3e50; margin-bottom: 50px; font-weight: 800; }
        
        /* 비포 & 애프터 구역 레이아웃 */
        .section-block {
            background-color: #fff; border-radius: 20px; padding: 40px 30px; margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); text-align: left;
        }
        
        /* 타이틀 스타일 수정: 글자색을 차분한 다크 그레이로 변경 */
        .section-title { 
            font-size: 1.6rem; 
            font-weight: 800; 
            color: #2c3e50; /* 어두운 회색/검정 계열 */
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            gap: 12px;
            letter-spacing: 0.5px;
        }

        /* 이모지 대신 일정한 톤을 유지하기 위한 CSS 커스텀 붉은색 네모 포인트 */
        .square-icon {
            width: 24px;
            height: 24px;
            background-color: #c0392b; /* 깔끔하고 톤다운된 붉은색 */
            border-radius: 6px;
            display: inline-block;
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.1);
        }

        .section-desc { font-size: 1.1rem; line-height: 1.7; color: #555; margin-bottom: 25px; }

        /* 비포 단일 이미지 스타일 */
        .before-img-box img { width: 100%; max-height: 450px; object-fit: cover; border-radius: 12px; }

        /* --- 애프터 슬라이드(Carousel) 스타일 --- */
        .slider-container { position: relative; width: 100%; max-width: 100%; margin: 0 auto; overflow: hidden; border-radius: 12px; }
        .slider-wrapper { display: flex; transition: transform 0.4s ease-in-out; width: 100%; }
